name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*', 'dev-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact official Flutter source
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git ../flutter-sdk
          test "$(git -C ../flutter-sdk rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/../flutter-sdk/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/../flutter-sdk/bin" >> "$GITHUB_PATH"
          fi
      - run: flutter --version
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev xvfb
      - name: Prepare official protoc
        run: python tool/prepare_protoc.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Distribution script regression tests
        run: python -m unittest discover -s tool -p "test_*.py"
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PROTOC="$PWD/assets/protoc/bin/protoc.exe"; fi
          flutter test
      - run: python tool/build_desktop.py ${{ matrix.target }}
      - name: Sign and package macOS
        if: runner.os == 'macOS'
        run: python3 tool/package_macos.py development
      - name: Compiled macOS smoke
        if: runner.os == 'macOS'
        run: python3 tool/smoke_release.py build/macos/Build/Products/Release/ProtoDesk.app/Contents/MacOS/ProtoDesk
      - name: Compiled Linux smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tool/smoke_release.py build/linux/x64/release/bundle/protodesk
      - name: Include redistributable Windows runtime
        if: runner.os == 'Windows'
        run: |
          $crt = Get-ChildItem "$env:ProgramFiles/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "Visual C++ redistributable runtime not found" }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
      - name: Compiled Windows smoke
        if: runner.os == 'Windows'
        run: python tool/smoke_release.py build/windows/x64/runner/Release/protodesk.exe
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/ProtoDesk-linux-x64.tar.gz bundle
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Get-ChildItem build/windows/x64/runner/Release -Recurse -Include *.pdb,*.ilk | Remove-Item
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/ProtoDesk-windows-x64.zip
      - name: Packaged fresh startup (macOS)
        if: runner.os == 'macOS'
        run: python3 tool/smoke_fresh.py build/macos/Build/Products/Release/ProtoDesk.app/Contents/MacOS/ProtoDesk
      - name: Packaged fresh startup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tool/smoke_fresh.py build/linux/x64/release/bundle/protodesk
      - name: Packaged fresh startup (Windows)
        if: runner.os == 'Windows'
        run: python tool/smoke_fresh.py build/windows/x64/runner/Release/protodesk.exe
      - name: Audit distributed bundle contents
        shell: bash
        run: python tool/audit_release.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target == 'macos' && 'ProtoDesk-macos-development' || format('ProtoDesk-{0}', matrix.target) }}
          path: dist/*
  notarize:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    environment: macos-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main-branch release commit
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Install exact official Flutter source
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git ../flutter-sdk
          test "$(git -C ../flutter-sdk rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$PWD/../flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: python3 tool/prepare_protoc.py
      - run: flutter pub get
      - run: python3 tool/build_desktop.py macos
      - name: Prepare protected temporary signing keychain
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: python3 tool/macos_ci_credentials.py setup
      - name: Developer ID, notarize, staple, Gatekeeper and extracted-artifact smoke
        run: sh tool/package_macos.sh
      - name: Always remove signing credentials
        if: always()
        run: python3 tool/macos_ci_credentials.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoDesk-macos-notarized
          path: |
            dist/release/ProtoDesk-macos-universal.zip
            dist/release/macos-notarization.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-macos-notarized
          path: dist
      - name: Require signed artifact evidence
        run: |
          python3 - <<'PY_VERIFY'
          import hashlib, json, pathlib
          root = pathlib.Path('dist')
          evidence = json.loads((root / 'macos-notarization.json').read_text())
          assert evidence['status'] == 'Accepted' and evidence['stapled'] and evidence['gatekeeper'] == 'accepted' and evidence['extractedSmoke'] == 'passed'
          assert hashlib.sha256((root / evidence['archive']).read_bytes()).hexdigest() == evidence['sha256']
          assert not list(root.glob('*development*'))
          PY_VERIFY
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "ProtoDesk ${GITHUB_REF_NAME}" --notes "Flutter desktop release. macOS is Developer ID signed, notarized and stapled; Windows is unsigned. Extract the complete bundle before running. No Flutter, Dart, or protoc installation is required." dist/*

  release-development:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dev-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main-branch development release commit
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ProtoDesk-macos-development
          path: dist
      - name: Require explicit development artifacts and checksum them
        run: |
          test -f dist/ProtoDesk-macos-development.zip
          test -f dist/ProtoDesk-windows-x64.zip
          test -f dist/ProtoDesk-linux-x64.tar.gz
          test ! -e dist/macos-notarization.json
          test ! -e dist/ProtoDesk-macos-universal.zip
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "ProtoDesk ${GITHUB_REF_NAME#dev-} — development" --notes-file docs/DEVELOPMENT_RELEASE.md dist/*
