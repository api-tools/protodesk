name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact official Flutter source
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git ../flutter-sdk
          test "$(git -C ../flutter-sdk rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$PWD/../flutter-sdk/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/../flutter-sdk/bin" >> "$GITHUB_PATH"
          fi
      - run: flutter --version
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Prepare official protoc
        run: python tool/prepare_protoc.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PROTOC="$PWD/assets/protoc/bin/protoc.exe"; fi
          flutter test
      - run: flutter build ${{ matrix.target }} --release
      - name: Sign and package macOS
        if: runner.os == 'macOS'
        run: sh tool/package_macos.sh
      - name: Compiled macOS smoke
        if: runner.os == 'macOS'
        run: python3 tool/smoke_release.py build/macos/Build/Products/Release/ProtoDesk.app/Contents/MacOS/ProtoDesk
      - name: Compiled Linux smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tool/smoke_release.py build/linux/x64/release/bundle/protodesk
      - name: Include redistributable Windows runtime
        if: runner.os == 'Windows'
        run: |
          $crt = Get-ChildItem "$env:ProgramFiles/Microsoft Visual Studio/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "Visual C++ redistributable runtime not found" }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
      - name: Compiled Windows smoke
        if: runner.os == 'Windows'
        run: python tool/smoke_release.py build/windows/x64/runner/Release/protodesk.exe
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/ProtoDesk-linux-x64.tar.gz bundle
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/ProtoDesk-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ProtoDesk-${{ matrix.target }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "ProtoDesk ${GITHUB_REF_NAME}" --notes "Flutter desktop release. macOS is ad-hoc signed and not notarized; Windows is unsigned. Extract the complete bundle before running. No Flutter, Dart, or protoc installation is required." dist/*
