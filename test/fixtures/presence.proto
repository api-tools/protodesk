syntax = "proto3";
package presence.fixture;
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";
message Child { optional string label = 1; google.protobuf.Empty empty = 2; }
message Request {
  optional string text = 1;
  Child child = 2;
  google.protobuf.StringValue string_wrapper = 3;
  google.protobuf.Int32Value int_wrapper = 4;
  google.protobuf.BoolValue bool_wrapper = 5;
  google.protobuf.Value value = 6;
  google.protobuf.NullValue nil = 7;
  repeated string names = 8;
  repeated Child children = 9;
  repeated google.protobuf.StringValue wrapped = 10;
  repeated google.protobuf.Value values = 11;
  repeated google.protobuf.NullValue nulls = 12;
  map<string, Child> children_by_name = 13;
  map<string, google.protobuf.Value> values_by_name = 14;
  map<string, google.protobuf.NullValue> nulls_by_name = 15;
  map<string, google.protobuf.StringValue> wrappers_by_name = 16;
}
service Presence { rpc Echo(Request) returns (Request); }
